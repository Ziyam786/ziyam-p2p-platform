name: Deploy ZiyamSelfDrive

on:
  push:
    branches: [main]

# Least-privilege default for the GITHUB_TOKEN: this workflow only checks
# out code and deploys over raw SSH using its own key secret — it never
# calls the GitHub API to write anything (no commits, packages, or
# security-event uploads like codeql.yml/codacy.yml do), so read-only
# access to repo contents is all it needs.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type-check & build
        run: npm run build

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            # Prune first, but WITHOUT -a: -a also drops every image's build
            # cache, forcing docker compose --build to redo npm ci/npm run
            # build from scratch for all 4 images on every single deploy —
            # that's what blew through appleboy/ssh-action's 10m default
            # command_timeout and killed the frontend build mid-step. The -f
            # prune here only clears stopped containers/networks/dangling
            # layers, a safety net if disk is tight, while leaving cache
            # from the last build's images intact for docker to reuse.
            # Full reclamation still happens below, after the new images
            # are built and their predecessors are genuinely unused. Never
            # touches named volumes (postgres_data/uploads_data) — that
            # requires the explicit --volumes flag, deliberately not passed here.
            sudo docker system prune -f
            cd /var/www/ziyam
            git pull origin main
            cd devops
            sudo docker compose up -d --build
            sudo docker exec -i devops-backend-1 npx prisma migrate deploy
            sudo docker system prune -af
