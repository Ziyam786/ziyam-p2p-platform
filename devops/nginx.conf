# Renter-facing site: ziyam.in — Next.js frontend on :3000, API under /api on :5000.
server {
    listen 80;
    server_name ziyam.in www.ziyam.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ziyam.in www.ziyam.in;

    ssl_certificate /etc/letsencrypt/live/ziyam.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziyam.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Internal ops dashboard: admin.ziyam.in — Next.js admin app on :3001.
# Requires: a DNS A/CNAME record for admin.ziyam.in pointing at this server,
# a cert covering it (e.g. `certbot --nginx -d admin.ziyam.in`), and
# ADMIN_URL=https://admin.ziyam.in set in the backend's .env so CORS
# (see src/backend/server.ts's allowedOrigins) accepts requests from it.
server {
    listen 80;
    server_name admin.ziyam.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.ziyam.in;

    ssl_certificate /etc/letsencrypt/live/admin.ziyam.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.ziyam.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

