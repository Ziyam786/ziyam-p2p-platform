<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>mobile</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Mappls (mappls_gl) web setup. This script tag needs a real access token
    from your own Mappls developer account (developer.mappls.com) — replace
    REPLACE_WITH_MAPPLS_ACCESS_TOKEN below with it directly in this file.
    Do not paste the token anywhere else (chat, tickets, commits messages);
    this file itself should stay out of source control once a real token is
    in it — same handling as any other client credential in this project.
  -->
  <script src="https://sdk.mappls.com/map/sdk/web?v=3.0&access_token=REPLACE_WITH_MAPPLS_ACCESS_TOKEN"></script>

  <!--
    Razorpay Checkout (web) — used by razorpay_checkout_web.dart via
    dart:js_interop. No token needed in this tag itself (unlike Mappls'
    above); the public key id is passed per-checkout from the backend's
    order response (RazorpayCheckoutSession.keyId) — see
    contracts/rest-api.md's Payment section.
  -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
